<style>

body{
margin:0;
font-family:Arial;
background:#06110a;
color:#0f0;
display:grid;
grid-template-columns:300px 1fr;
grid-template-rows:80px 1fr 180px;
height:100vh
}

.control-header{

grid-column:1/3;

padding:15px;

border-bottom:1px solid #00ff00;

background:

linear-gradient(
90deg,
#001000,
#002500,
#001000
);

box-shadow:

0 0 20px #00ff00;

position:relative;

overflow:hidden;

}


/* Green Cyber Scrollbar */

::-webkit-scrollbar {

    width: 8px;
    height: 8px;

}


::-webkit-scrollbar-track {

    background:#001000;

    border-left:1px solid #003300;

}


::-webkit-scrollbar-thumb {

    background:#00ff00;

    border-radius:10px;

    box-shadow:
    0 0 10px #00ff00;

}


::-webkit-scrollbar-thumb:hover {

    background:#33ff33;

    box-shadow:
    0 0 20px #00ff00;

}


.control-header::before{

content:"";

position:absolute;

top:0;

left:-100%;

width:100%;

height:2px;

background:#00ff00;

animation:scan 3s infinite;

}



@keyframes scan{

0%{
left:-100%;
}

100%{
left:100%;
}

}



.brand{

font-size:22px;

letter-spacing:3px;

color:#00ff00;

text-shadow:

0 0 10px #00ff00;

}



.blink{

color:#00ff00;

animation:blink 1s infinite;

}



@keyframes blink{

50%{
opacity:0;
}

}



.status{

position:absolute;

right:20px;

top:20px;

color:#00ff00;

font-weight:bold;

}



.online-dot{

display:inline-block;

width:10px;

height:10px;

background:#00ff00;

border-radius:50%;

margin-right:5px;

box-shadow:

0 0 15px #00ff00;

animation:pulse 1s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.8);

opacity:.5;

}

}



#target-url{

margin-top:12px;

font-family:monospace;

}



#target-url a{

color:#00ff00;

text-decoration:none;

}



#target-url a:hover{

text-shadow:

0 0 10px #00ff00;

}




.instagram{
position: relative;

letter-spacing:normal;

top: -3.5px;

padding:2px 5px;

border:1px solid #00ff00;

border-radius:20px;

color:#00ff00;

text-decoration:none;

font-size:12px;

transition:.3s;

}



.instagram:hover{

background:#00ff00;

color:#000;

box-shadow:

0 0 20px #00ff00;

}

#target-url{
background:#000;
padding:8px;
margin-top:8px;
color:#0f0;
}

aside{
overflow:auto;
border-right:1px solid #0f0;
padding:10px;
}

main{
position:relative;
}

#map{
height:100%;
width:100%;
}

.card{
padding:10px;
border:1px solid #0f0;
margin:8px 0;
cursor:pointer;
}

footer{
grid-column:1/3;
border-top:1px solid #0f0;
overflow:auto;
padding:10px;
font-family:monospace;
}


.leaflet-tile {
    filter:
    hue-rotate(70deg)
    saturate(1.8)
    brightness(0.8);
}


.leaflet-container {
    background:#001500;
}



.pulse{

width:18px;
height:18px;

background:#00ff00;

border-radius:50%;

box-shadow:
0 0 10px #00ff00,
0 0 25px #00ff00;

animation:pulse 1s infinite;

}


@keyframes pulse{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.8);
opacity:.4;
}

100%{
transform:scale(1);
opacity:1;
}

}

#log{

grid-column:1/3;

border-top:1px solid #0f0;

display:grid;

grid-template-columns:1fr 1fr;

overflow:hidden;

font-family:monospace;

}


.terminal-left{

padding:10px;

overflow:auto;

border-right:1px solid #0f0;

color:#0f0;

}



.terminal-right{

position:relative;

padding-left:12px;

overflow:hidden;

color:#00ff00;

}



.moving-warning{

position:absolute;

font-size: 14px;

margin-top:0.2px;

color:red;

font-weight:bold;

white-space:nowrap;

text-shadow:

0 0 10px red;


animation:warningMove 26s linear infinite;

}







#hack-terminal{
    height:120px;
    overflow:hidden;
    font-family:Consolas, monospace;
    color:#00ff00;
    line-height:1.5;
}

.hack-line{
    white-space:pre;
}

.hack-line::after{
    content:"_";
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}



#hack-terminal{
    height:120px;
    overflow:hidden;
    background:#000;
    color:#00ff00;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.45;
    padding:8px;
    margin-top: 20px;
    text-shadow:0 0 6px currentColor;
}

#hack-terminal div{
    white-space:pre;
}

#hack-terminal div::after{
    content:"_";
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}



</style>

function type(text,color,callback){

    const line=document.createElement("div");

    line.style.color=color;

    terminal.appendChild(line);

    let i=0;

    const timer=setInterval(()=>{

        line.textContent+=text[i]||"";

        i++;

        if(i>text.length){

            clearInterval(timer);

            if(terminal.children.length>12){
                terminal.removeChild(terminal.firstChild);
            }

            callback();

        }

    },20);

}

function run(){

    const txt=commands[Math.floor(Math.random()*commands.length)];

    const color=colors[Math.floor(Math.random()*colors.length)];

    type(txt,color,()=>{

        setTimeout(run,150);

    });

}

run();










let lineIndex = 0;

function typeLine() {

    if (lineIndex >= commands.length) {

        setTimeout(() => {

            terminal.innerHTML = "";
            lineIndex = 0;
            typeLine();

        }, 2500);

        return;
    }

    const line = document.createElement("div");
    line.className = "hack-line";

    terminal.appendChild(line);

    let charIndex = 0;

    function typeChar() {

        if (charIndex < commands[lineIndex].length) {

            line.textContent += commands[lineIndex][charIndex];
            charIndex++;

            setTimeout(typeChar, 35);   // typing speed

        } else {

            lineIndex++;

            if (terminal.children.length > 8) {
                terminal.removeChild(terminal.firstChild);
            }

            setTimeout(typeLine, 350);

        }

    }

    typeChar();

}

function log(t){

logBox.scrollTop=logBox.scrollHeight;

const map=L.map("map")
.setView([20.5937,78.9629],5);



const cyberMap = L.tileLayer(
"https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_3vmw_1_dd75b3cef7543153dfdb462f",

).addTo(map);

}
);

);


cyberMap.addTo(map);


L.control.layers({
    "Cyber Map":cyberMap,

}).addTo(map);



const markers={};

const greenIcon = L.divIcon({

    html: `
    <div class="pulse"></div>
    `,

    className:"",

    iconSize:[20,20]

});

let selected=null;



function ensureMarker(id,lat,lng){


if(!markers[id]){


markers[id] = L.marker(
    [lat,lng],
    {
        icon: greenIcon
    }
)
.addTo(map)
.bindPopup(id);


const card=document.createElement("div");

card.className="card";

card.id="card-"+id;


card.onclick=()=>{


selected=id;


let p=markers[id].getLatLng();


map.setView(
[p.lat,p.lng],
15
);


markers[id].openPopup();


};



targets.appendChild(card);



}



markers[id].setLatLng(
[lat,lng]
);



document.getElementById(
"card-"+id
).innerHTML=
`
<b>${id}</b>
<br>
Lat: ${lat.toFixed(5)}
<br>
Lng: ${lng.toFixed(5)}
`;



if(selected===id){

[lat,lng]
);

}



}
